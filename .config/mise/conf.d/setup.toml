[tasks.setup]
description = "Prepare everything required to build and run slik"
depends = ["check:gstreamer:plugins", "setup:model"]

[tasks."check:gstreamer"]
description = "Check the GStreamer development libraries and runtime plugins"
run = '''
set -eu

install_hint() {
  case "$(uname -s)" in
    Darwin)
      echo "Install it with 'brew install gstreamer', or install the official GStreamer runtime and development packages." >&2
      ;;
    Linux)
      echo "On Debian/Ubuntu, install: pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav" >&2
      ;;
    *)
      echo "Install GStreamer 1.24 or newer, its development files, gst-inspect-1.0, and the base/good plugins." >&2
      ;;
  esac
}

if ! command -v pkg-config >/dev/null 2>&1; then
  echo "pkg-config was not found." >&2
  install_hint
  exit 1
fi

if ! pkg-config --exists gstreamer-1.0 gstreamer-video-1.0; then
  echo "The GStreamer core and video development libraries were not found." >&2
  install_hint
  exit 1
fi

if ! pkg-config --atleast-version=1.24 gstreamer-1.0; then
  version="$(pkg-config --modversion gstreamer-1.0)"
  echo "GStreamer 1.24 or newer is required; found $version." >&2
  install_hint
  exit 1
fi

if ! command -v gst-inspect-1.0 >/dev/null 2>&1; then
  echo "gst-inspect-1.0 was not found." >&2
  install_hint
  exit 1
fi

version="$(pkg-config --modversion gstreamer-1.0)"
echo "GStreamer $version development libraries and tools are available."
'''

[tasks."check:gstreamer:plugins"]
description = "Check the GStreamer runtime plugins used by slik"
depends = ["check:gstreamer"]
run = '''
set -eu

required_elements="
capsfilter
decodebin
fakesink
filesrc
identity
queue
rtspsrc
videocrop
videoscale
videotestsrc
videoconvert
"

missing=""
for element in $required_elements; do
  if ! gst-inspect-1.0 --exists "$element"; then
    missing="$missing $element"
  fi
done

if [ -n "$missing" ]; then
  echo "Missing GStreamer elements required by slik:$missing" >&2
  echo "Install the GStreamer base and good plugin collections, then rerun this task." >&2
  exit 1
fi

echo "All required GStreamer runtime elements are available."
'''

[tasks."check:gstreamer:preview"]
description = "Check the optional GStreamer plugins used by preview output"
depends = ["check:gstreamer"]
run = '''
set -eu

missing=""
for element in objectdetectionoverlay autovideosink; do
  if ! gst-inspect-1.0 --exists "$element"; then
    missing="$missing $element"
  fi
done

if [ -n "$missing" ]; then
  echo "Missing optional GStreamer preview elements:$missing" >&2
  case "$(uname -s)" in
    Darwin)
      echo "Install it with 'brew install gstreamer', then rerun this task." >&2
      ;;
    Linux)
      echo "On Debian/Ubuntu, install: gstreamer1.0-plugins-bad gstreamer1.0-plugins-good" >&2
      ;;
    *)
      echo "Install the GStreamer bad and good plugin collections, then rerun this task." >&2
      ;;
  esac
  exit 1
fi

echo "GStreamer preview elements are available: objectdetectionoverlay autovideosink."
'''

[tasks."setup:model"]
description = "Download and verify all required models"
depends = ["setup:model:nanodet-plus-m-320"]

[tasks."setup:model:nanodet-plus-m-320"]
description = "Download and verify the NanoDet-Plus-m 320x320 model and model info"
run = '''
set -eu

model="crates/slik/models/nanodet-plus-m-320.onnx"
model_url="https://github.com/RangiLyu/nanodet/releases/download/v1.0.0-alpha-1/nanodet-plus-m_320.onnx"
model_expected="4f12723cce3d48e47ca92cb925ba74d97a965c069208edca660bbb9f7ce2c610"
model_info="${model}.modelinfo"
gstsmith_revision="c989860b8da726d84d7f3690f9cd41f8b2cc6529"
model_info_url="https://raw.githubusercontent.com/zbiljic/gstsmith-rs/${gstsmith_revision}/analytics/nanodet/tests/fixtures/nanodet-plus-m-320.onnx.modelinfo"
model_info_expected="fba887f2e0106ceb16c053193086db274820199ff4edda33def73412ac48a359"

sha256() {
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum "$1" | awk '{print $1}'
  elif command -v shasum >/dev/null 2>&1; then
    shasum -a 256 "$1" | awk '{print $1}'
  else
    echo "Cannot verify model assets: install sha256sum or shasum." >&2
    return 1
  fi
}

install_asset() {
  asset_path="$1"
  asset_url="$2"
  asset_expected="$3"
  asset_label="$4"

  if [ -f "$asset_path" ]; then
    asset_actual="$(sha256 "$asset_path")"
    if [ "$asset_actual" != "$asset_expected" ]; then
      echo "$asset_label checksum mismatch: $asset_path" >&2
      echo "Expected: $asset_expected" >&2
      echo "Actual:   $asset_actual" >&2
      echo "Remove the file and rerun 'mise run setup:model:nanodet-plus-m-320' to download a clean copy." >&2
      return 1
    fi
    echo "$asset_label is already present and verified: $asset_path"
    return
  fi

  if ! command -v curl >/dev/null 2>&1; then
    echo "curl is required to download $asset_label." >&2
    return 1
  fi

  mkdir -p "$(dirname "$asset_path")"
  asset_partial="$asset_path.part.$$"
  trap 'rm -f "$asset_partial"' EXIT HUP INT TERM

  echo "Downloading $asset_label..."
  curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
    --output "$asset_partial" "$asset_url"

  asset_actual="$(sha256 "$asset_partial")"
  if [ "$asset_actual" != "$asset_expected" ]; then
    echo "Downloaded $asset_label checksum mismatch." >&2
    echo "Expected: $asset_expected" >&2
    echo "Actual:   $asset_actual" >&2
    return 1
  fi

  mv "$asset_partial" "$asset_path"
  trap - EXIT HUP INT TERM
  echo "$asset_label installed and verified: $asset_path"
}

install_asset "$model" "$model_url" "$model_expected" "NanoDet-Plus-m 320x320 model"
install_asset "$model_info" "$model_info_url" "$model_info_expected" "NanoDet model info"
'''
