[tasks.fmt]
description = "Format project source and Cargo manifests"
depends = ["rust:fmt", "fmt:toml"]

[tasks."fmt:check"]
description = "Check source and Cargo manifest formatting"
depends = ["rust:fmt:check", "fmt:toml:check"]

[tasks."fmt:toml"]
description = "Format Cargo manifests"
run = "cargo fmt-toml"

[tasks."fmt:toml:check"]
description = "Check Cargo manifest formatting"
run = "cargo fmt-toml --check"

[tasks."sort:crates"]
description = "Sort workspace dependencies"
run = "cargo sort --workspace --grouped"

[tasks."sort:crates:check"]
description = "Check workspace dependency ordering"
run = "cargo sort --workspace --grouped --check"

[tasks.lint]
description = "Run all lint checks"
depends = ["rust:lint:clippy"]

[tasks.check]
description = "Check project source code"
depends = ["rust:check:workspace"]

[tasks.test]
description = "Run tests"
alias = "t"
depends = ["rust:test"]

[tasks."pre-commit"]
description = "Run the full local development gate"
alias = "prk"
depends = [
    "sort:crates:check",
    "fmt:check",
    "lint",
    "check",
    "test",
]
